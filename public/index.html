<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#3b2f6f"/><meta name="description" content="여러 도서관의 대출 반납일을 한 곳에서 관리하세요."/><title>반납 | 도서관 반납일 관리</title><link rel="manifest" href="manifest.webmanifest"/><link rel="stylesheet" href="style.css"/></head>
<body><main class="shell"><header><div class="brand"><p class="eyebrow">LIBRARY RETURN TRACKER</p><h1>반납</h1><p class="intro">빌린 곳은 달라도, 반납 일정은 한눈에.</p></div><div class="header-actions"><button class="account" id="accountBtn">로그인</button><button class="add-top" id="openDialog" aria-label="책 추가" title="책 추가">+</button></div></header>
<section class="summary" aria-label="반납 일정 요약"><div class="ring"><strong id="dueCount">2</strong><span>이번 주</span></div><div><p class="label">가장 가까운 반납일</p><h2 id="nextDue">내일 · 9월 2일</h2><p id="nextTitle">달러구트 꿈 백화점 · 서울도서관</p></div></section>
<nav class="filters" aria-label="목록 필터"><button class="active" data-filter="all">전체 <span id="totalCount"></span></button><button data-filter="soon">임박</button><button data-filter="completed">반납완료</button></nav>
<section class="list-wrap"><div class="section-head"><h2>내 대출 목록</h2><button class="text-btn" id="sortBtn">반납일순 ↓</button></div><div id="bookList" class="book-list"></div></section>
<section class="library-card"><div><span class="building">▥</span><p class="label">이번 주 반납처</p><h2 id="libraryName">서울도서관</h2><p id="libraryDetail">2권을 반납해야 해요</p></div><button id="showMap">가는 길 보기 ↗</button></section><section class="lockscreen-card"><div><p class="label">ANDROID 잠금화면</p><h2>반납 카드</h2><p id="lockscreenHint">반납 임박 도서를 잠금화면에서 바로 확인하세요.</p></div><button id="lockscreenBtn" type="button">잠금화면 카드 켜기</button></section>
</main>
<dialog id="bookDialog"><form method="dialog" id="bookForm"><div class="dialog-head"><h2>대출 책 추가</h2><button value="cancel" class="close" aria-label="닫기">×</button></div><label>서적명<input id="title" list="bookSuggestions" required placeholder="제목을 입력하거나 인기 도서에서 선택" autocomplete="off"/><datalist id="bookSuggestions"></datalist></label><p class="hint" id="bookHint">목록에 있는 책을 고르면 저자와 출판년도가 자동 입력돼요.</p><div class="two-fields"><label>저자명<input id="author" placeholder="자동 입력 또는 직접 입력"/></label><label>출판년도<input id="publishedYear" inputmode="numeric" placeholder="예: 2026"/></label></div><label>대출일<input id="loanDate" type="date" required/></label><label>대출한 도서관<input id="library" placeholder="입력하지 않으면 ‘어느 도서관’"/></label><label>반납일<input id="dueDate" type="date" required/><span class="hint" id="dueHint">기본 대출 기간 120일</span></label><label>반납 장소 / 메모<input id="location" placeholder="예: 1층 무인반납함"/></label><button class="save" value="default">목록에 추가</button></form></dialog>
<dialog id="authDialog"><form method="dialog" id="authForm"><div class="dialog-head"><div><p class="eyebrow">MY LIBRARY</p><h2 id="authTitle">로그인</h2></div><button value="cancel" class="close" aria-label="닫기">×</button></div><p class="auth-copy" id="authCopy">로그인하면 어느 기기에서나 내 반납 목록을 볼 수 있어요.</p><label>이메일<input id="email" type="email" required placeholder="you@example.com"/></label><label>비밀번호<input id="password" type="password" minlength="6" required placeholder="6자 이상"/></label><button class="save" id="authSubmit" value="default">로그인</button><button class="switch-auth" type="button" id="switchAuth">처음이신가요? 회원가입</button></form></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
