name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec cap add android
      - run: pnpm exec cap sync android
      - run: node scripts/prepare-android-lockscreen.mjs
        env:
          BANNAP_VERSION_CODE: ${{ github.run_number }}
      - name: Restore app signing key
        env:
          BANNAP_KEYSTORE_B64: ${{ secrets.BANNAP_KEYSTORE_B64 }}
        run: echo "$BANNAP_KEYSTORE_B64" | base64 --decode > android/app/bannap-release.jks
      - name: Build signed release APK
        env:
          BANNAP_KEYSTORE_PASSWORD: ${{ secrets.BANNAP_KEYSTORE_PASSWORD }}
          BANNAP_KEY_ALIAS: ${{ secrets.BANNAP_KEY_ALIAS }}
          BANNAP_KEY_PASSWORD: ${{ secrets.BANNAP_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: bannap-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.run_number }}
        run: >-
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk#Bannap.apk
          --repo "${{ github.repository }}"
          --title "반납 Android APK #${{ github.run_number }}"
          --generate-notes
